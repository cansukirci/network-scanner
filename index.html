<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Network Scanner</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f7f7f7;
        }

        h1 {
            margin-bottom: 20px;
        }

        .scan-area {
            margin-bottom: 15px;
        }

        input {
            padding: 10px;
            font-size: 14px;
            width: 200px;
            margin-right: 10px;
        }

        button {
            padding: 10px 18px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 10px;
        }

        #status {
            margin-top: 15px;
            margin-bottom: 10px;
        }

        #lastScan {
            margin-bottom: 20px;
            font-size: 14px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 180px;
        }

        .card h3 {
            margin: 0 0 10px 0;
        }

        .card p {
            font-size: 28px;
            margin: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #eeeeee;
        }

    </style>
</head>


<body>

    <h1>Network Scanner Dashboard</h1>


    <div class="scan-area">

        <input
            type="text"
            id="ipRange"
            value="192.168.1.0/24"
            placeholder="Örn: 192.168.1.0/24"
        >

        <button onclick="scanNetwork()">
            Ağı Tara
        </button>

        <button onclick="exportCSV()">
            CSV İndir
        </button>

    </div>


    <p id="status"></p>


    <p id="lastScan">
        Son tarama: Henüz tarama yapılmadı
    </p>


    <div class="cards">

        <div class="card">
            <h3>Toplam Cihaz</h3>
            <p id="totalDevices">0</p>
        </div>

        <div class="card">
            <h3>Aktif Cihaz</h3>
            <p id="activeDevices">0</p>
        </div>

        <div class="card">
            <h3>Pasif Cihaz</h3>
            <p id="passiveDevices">0</p>
        </div>

    </div>


    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>IP</th>
                <th>MAC</th>
                <th>Hostname</th>
                <th>Açık Portlar</th>
                <th>Durum</th>
            </tr>
        </thead>

        <tbody id="deviceTable">
        </tbody>

    </table>


    <script>

        function loadDevices() {

            fetch("/devices")
                .then(response => response.json())
                .then(devices => {

                    const table =
                        document.getElementById("deviceTable");

                    table.innerHTML = "";

                    let activeCount = 0;
                    let passiveCount = 0;


                    devices.forEach(device => {

                        if (device.last_seen === 1) {
                            activeCount++;
                        } else {
                            passiveCount++;
                        }


                        const row =
                            document.createElement("tr");


                        row.innerHTML = `
                            <td>${device.id}</td>
                            <td>${device.ip}</td>
                            <td>${device.mac}</td>
                            <td>${device.hostname}</td>
                            <td>${device.open_ports.join(", ")}</td>
                            <td>
                                ${device.last_seen === 1
                                    ? "Aktif"
                                    : "Pasif"}
                            </td>
                        `;


                        table.appendChild(row);
                    });


                    document
                        .getElementById("totalDevices")
                        .innerText = devices.length;


                    document
                        .getElementById("activeDevices")
                        .innerText = activeCount;


                    document
                        .getElementById("passiveDevices")
                        .innerText = passiveCount;

                });
        }


        function loadLastScan() {

            fetch("/last-scan")
                .then(response => response.json())
                .then(result => {

                    if (result.last_scan) {

                        document
                            .getElementById("lastScan")
                            .innerText =
                            "Son tarama: " + result.last_scan;

                    } else {

                        document
                            .getElementById("lastScan")
                            .innerText =
                            "Son tarama: Henüz tarama yapılmadı";
                    }

                });
        }


        function scanNetwork() {

            const status =
                document.getElementById("status");

            const ipRange =
                document.getElementById("ipRange").value;


            if (ipRange.trim() === "") {

                status.innerText =
                    "Lütfen bir IP aralığı girin.";

                return;
            }


            status.innerText =
                ipRange + " ağı taranıyor...";


            fetch("/scan", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    ip_range: ipRange
                })

            })

                .then(async response => {

                    const result =
                        await response.json();

                    if (!response.ok) {

                        throw new Error(
                            result.detail || "Bir hata oluştu"
                        );
                    }

                    return result;
                })

                .then(result => {

                    status.innerText =
                        "Tarama tamamlandı. "
                        + "Bu taramada bulunan cihaz sayısı: "
                        + result.device_count;

                    loadDevices();

                    loadLastScan();

                })

                .catch(error => {

                    status.innerText =
                        "Hata: " + error.message;

                });
        }


        function exportCSV() {

            window.location.href = "/export";

        }


        loadDevices();

        loadLastScan();

    </script>

</body>

</html>
